version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rinsego-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rinsego_db}
      POSTGRES_USER: ${DB_USER:-rinsego_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rinsego_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rinsego_admin} -d ${DB_NAME:-rinsego_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rinsego-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-rinsego_super_secret_jwt_key_2026}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rinsego_db}
      DB_USER: ${DB_USER:-rinsego_admin}
      DB_PASSWORD: ${DB_PASSWORD:-rinsego_secure_pass}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rinsego-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: rinsego-nginx-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro

volumes:
  pgdata:
  uploads_data:
